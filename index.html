function n(o){o=o||S;return Math.max(1,o.f+o.m+o.u)}
function lim(o,i){return (o.f*F[i]+o.m*M[i]+o.u*F[i])/n(o)}
function effAbv(o,i){return o.abvU?60:(o.abv>0?o.abv:D[i][2])}
function sdOf(o){return D[o.dt][1]*effAbv(o,o.dt)/100*0.789/14}
function stdMin(o){return Math.round(sdOf(o)*60)}
function ivMs(o){return (o.iv>0?o.iv:stdMin(o))*6e4}
function syncO(o){o.pp=o.pp||[];['f','m','u'].forEach(function(k){var c=o.pp.filter(function(p){return p.g===k});while(c.length>o[k]){o.pp.splice(o.pp.lastIndexOf(c.pop()),1)}while(c.length<o[k]){var q={n:'نفر '+fa(o.pp.length+1),g:k,sd:0,lr:0,nx:0};o.pp.push(q);c.push(q)}})}
function stats(){var avg=S.sd/n(),h=(Date.now()-S.start)/36e5;return{avg:avg,pace:avg/(h+1),h:h}}
function plv(p){var h=(Date.now()-S.start)/36e5,k=p.g==='m'?M:F,a=0,b=0;for(var i=0;i<3;i++){if(p.sd>=k[i])a=i+1;if(p.sd/(h+1)>=PC[i])b=i+1}return Math.max(a,b)}
function lvl(){if(S.nm&&S.pp.length)return Math.max.apply(null,S.pp.map(plv));var s=stats(),a=0,b=0;for(var i=0;i<3;i++){if(s.avg>=lim(S,i))a=i+1;if(s.pace>=PC[i])b=i+1}return Math.max(a,b)}
function topName(){var b=null,m=-1;S.pp.forEach(function(p){var l=plv(p);if(l>m){m=l;b=p}});return b?b.n:''}
function tx(){return (n()===1?TXS:TXG)[S.tone]}
function lvText(l){return tx().l[l].replace(/‹([^›]*)›/g,S.home==='stay'?'':'$1')}
function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=660;g.gain.value=.15;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.35)}catch(e){}}
function check(ok){var l=lvl();if(ok&&l>S.lv&&l>0){alertLv=l;alertMsg='';alertWho=S.nm?topName():'';try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}beep()}S.lv=l}

function needWater(){var d=S.sd-S.wsd;return d>=n()*1.8||(d>=n()*.8&&Date.now()-S.last>=12e5)}
function addG(d,r){S.st.push({d:d,r:r,pn:S.next,pl:S.last,pr:S.lr||0});S.sd+=d;S.rounds+=r;S.last=Date.now()}
function tf(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function ptxt(p,now){if(!p.lr||!p.nx)return 'آماده';var el=now-p.lr,tot=p.nx-p.lr;return el>=tot?'نوبتش رسیده':tf(el)+' از '+tf(tot)}
function ppct(p,now){if(!p.lr||!p.nx)return 0;return Math.min(100,Math.round((now-p.lr)/(p.nx-p.lr)*100))}
function ckSd(c){var s=0;c[2].forEach(function(q){if(typeof q[1]==='number'&&q[2]>0)s+=q[1]*q[2]/100*0.789/14});return s*(ckLight?.5:1)}
